name: Update launch data

on:
  schedule:
    - cron: '0 8 * * *' # daily at 8:00 UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest launch data
        run: curl -fSL -o src/data/launchlog.tsv https://planet4589.org/space/gcat/tsv/derived/launchlog.tsv

      - name: Commit and push if changed
        run: |
          git diff --quiet src/data/launchlog.tsv && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/launchlog.tsv
          git commit -m "Update launch data $(date -u +%Y-%m-%d)"
          git push
