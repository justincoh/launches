name: Update launch data

on:
  schedule:
    - cron: '0 8 * * *' # daily at 8:00 UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest launch data
        run: curl -fSL -o public/launchlog.tsv https://planet4589.org/space/gcat/tsv/derived/launchlog.tsv

      - name: Copy to root
        run: cp public/launchlog.tsv launchlog.tsv

      - name: Commit and push if changed
        id: commit
        run: |
          git diff --quiet public/launchlog.tsv && echo "changed=false" >> "$GITHUB_OUTPUT" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/launchlog.tsv launchlog.tsv
          git commit -m "Update launch data $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
