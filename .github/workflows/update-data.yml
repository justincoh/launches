name: Update launch data

on:
  schedule:
    - cron: '0 8 * * *' # daily at 8:00 UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest launch data
        run: curl -fSL -o src/data/launchlog.tsv https://planet4589.org/space/gcat/tsv/derived/launchlog.tsv

      - name: Sanitize data
        run: bash scripts/sanitize-data.sh src/data/launchlog.tsv

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet src/data/launchlog.tsv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/launchlog.tsv
          git commit -m "Update launch data $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
